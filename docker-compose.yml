version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: glasskom_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-glasskom}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: glasskom_api
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-glasskom}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-glasskom_secret_key_vps}
      API_KEY: ${API_KEY}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db

volumes:
  pgdata: