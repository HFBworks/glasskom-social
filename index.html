    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Social App</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GlassKom" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              'trajan': ['Cinzel', 'serif'],
              'sans': ['Inter', 'sans-serif'],
            },
            colors: {
              charcoal: {
                900: '#121212', // Deep Charcoal
                800: '#1E1E1E', // Lighter Charcoal
                700: '#2C2C2C',
                600: '#3D3D3D',
              },
              // We will map 'primary' to the start of the gradient for solid fallbacks
              primary: {
                50: '#eef8ff',
                100: '#d9f0ff',
                500: '#4FACFE', // Gradient Start
                600: '#00F2FE', // Gradient End
                700: '#00c2cb',
              }
            },
            backgroundImage: {
              // Dynamic gradients using CSS variables
              'gradient-primary': 'linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%)',
              'gradient-accent': 'linear-gradient(135deg, var(--accent-start) 0%, var(--accent-end) 100%)',
              'gradient-success': 'linear-gradient(135deg, #43E97B 0%, #38F9D7 100%)',
              'gradient-dark': 'linear-gradient(to bottom right, #121212, #1E1E1E)',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      :root {
        /* Default Theme (Cosmic Blue) */
        --gradient-start: #4FACFE;
        --gradient-end: #00F2FE;
        --accent-start: #FF6A88;
        --accent-end: #FF99AC;
      }

      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #121212; 
        color: #f3f4f6;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      
      /* Windows 7 Aero Glass Dark Style */
      .aero-panel {
        background: rgba(30, 30, 30, 0.4);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 
          0 4px 30px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.15); /* Top shine */
      }
      
      .aero-card {
        background: rgba(40, 40, 40, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
      }

      /* Subtle gradient overlay to mimic glass sheen */
      .aero-card::before, .aero-panel::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 40%;
        background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
        pointer-events: none;
        z-index: 0;
      }

      .aero-input {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        transition: all 0.2s;
      }
      .aero-input:focus {
        background: rgba(0, 0, 0, 0.5);
        border-color: #4FACFE; /* Fallback */
        border-color: var(--gradient-start);
        box-shadow: 0 0 10px rgba(79, 172, 254, 0.3);
      }
    </style>
